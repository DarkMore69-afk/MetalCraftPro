name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package MetalCraft Pro
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n 1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo 'No Xcode installation found on this runner.' >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate project and build unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project MetalCraftPro.xcodeproj \
            -scheme MetalCraftPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MetalCraftPro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM=''

      - name: Package real compiled app into IPA
        run: |
          python3 package_ipa.py \
            --app "$RUNNER_TEMP/MetalCraftPro.xcarchive/Products/Applications/MetalCraftPro.app" \
            --output "$RUNNER_TEMP/MetalCraftPro-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetalCraftPro-unsigned-ipa
          path: ${{ runner.temp }}/MetalCraftPro-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
